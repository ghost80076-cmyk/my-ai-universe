<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYTHOS AI | 創作者原創角色宇宙</title>
    <style>
        :root { --bg: #0d0e12; --card-bg: #16181f; --accent: #d4af37; --text: #f4f4f5; --muted: #a1a1aa; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 850px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #27272a; padding-bottom: 15px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .card { background: var(--card-bg); border: 1px solid #27272a; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: 0.2s; }
        .card:hover { border-color: var(--accent); transform: translateY(-3px); }
        .card-img { width: 100%; height: 180px; object-fit: cover; }
        .card-body { padding: 15px; flex-grow: 1; }
        .tag { background: #27272a; color: var(--accent); font-size: 11px; padding: 2px 6px; border-radius: 4px; margin-right: 4px; }
        
        #chat-view { display: none; }
        .control-bar { background: var(--card-bg); border: 1px solid #27272a; padding: 15px; border-radius: 10px; margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
        .control-bar select, .control-bar input { background: #09090b; border: 1px solid #27272a; color: #fff; padding: 8px; border-radius: 6px; }
        .chat-stream { background: #000; border: 1px solid #27272a; height: 420px; overflow-y: auto; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .input-area { display: flex; gap: 10px; }
        textarea { flex-grow: 1; background: var(--card-bg); border: 1px solid #27272a; color: #fff; padding: 10px; border-radius: 8px; height: 40px; resize: none; }
        button { background: var(--accent); border: none; font-weight: bold; padding: 0 20px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2 style="color:var(--accent); margin:0;">⚡ MYTHOS PORTAL</h2>
        <span style="font-size:12px; color:var(--muted);">LunaTalk Edition</span>
    </header>

    <div id="lobby-view">
        <p style="color:var(--muted); font-size:14px;">選擇你想進行互動的原創角色：</p>
        <div class="grid" id="character-list"></div>
    </div>

    <div id="chat-view">
        <button onclick="showLobby()" style="background:none; color:var(--muted); border:none; cursor:pointer; margin-bottom:10px; padding:0;">← 返回角色大廳</button>
        
        <div class="control-bar">
            <select id="model-select">
                <option value="anthropic/claude-3.5-sonnet">Claude 3.5 Sonnet (OpenRouter)</option>
                <option value="deepseek/deepseek-chat">DeepSeek V3 (OpenRouter)</option>
                <option value="openai/gpt-4o">GPT-4o (OpenRouter)</option>
            </select>
            <input type="password" id="user-key" placeholder="貼上您的 API Key..." style="flex-grow:1;">
        </div>

        <div class="chat-stream" id="chat-stream"></div>

        <div class="input-area">
            <textarea id="user-input" placeholder="輸入行動或對話..."></textarea>
            <button onclick="sendMessage()">發送</button>
        </div>
    </div>
</div>

<script>
    const characterFiles = ['linchenfeng.json'];
    let loadedCharacters = {};
    let activeChar = null;

    window.onload = async () => {
        const listContainer = document.getElementById('character-list');
        for (let file of characterFiles) {
            try {
                const res = await fetch(file);
                const char = await res.json();
                loadedCharacters[char.id] = char;
                
                listContainer.innerHTML += `
                    <div class="card" onclick="openCharacter('${char.id}')">
                        <img src="${char.avatar}" class="card-img">
                        <div class="card-body">
                            <h3 style="margin:0 0 5px 0;">${char.name}</h3>
                            <div style="margin-bottom:10px;">${char.tags.map(t => `<span class="tag">#${t}</span>`).join('')}</div>
                            <p style="font-size:12px; color:var(--muted); margin:0; line-height:1.5;">${char.description}</p>
                        </div>
                    </div>
                `;
            } catch (e) { console.error("角色載入失敗:", file); }
        }
    };

    function openCharacter(id) {
        activeChar = loadedCharacters[id];
        document.getElementById('lobby-view').style.display = 'none';
        document.getElementById('chat-view').style.display = 'block';
        document.getElementById('chat-stream').innerHTML = `<div style="margin-bottom:15px;">${activeChar.greeting}</div>`;
    }

    function showLobby() {
        document.getElementById('chat-view').style.display = 'none';
        document.getElementById('lobby-view').style.display = 'block';
    }

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const key = document.getElementById('user-key').value.trim();
        const model = document.getElementById('model-select').value;
        const text = input.value.trim();

        if (!text) return;
        if (!key) { alert('請填入您的 API Key！'); return; }

        const stream = document.getElementById('chat-stream');
        stream.innerHTML += `<div style="text-align:right; margin:15px 0;"><span style="background:#27272a; padding:8px 12px; border-radius:6px; font-size:14px;">${text}</span></div>`;
        input.value = '';

        try {
            const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${key}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: model,
                    messages: [
                        { role: "system", content: activeChar.system_prompt },
                        { role: "user", content: text }
                    ]
                })
            });
            const data = await response.json();
            const reply = data.choices[0].message.content;

            stream.innerHTML += `<div style="text-align:left; margin:15px 0;">${reply}</div>`;
            stream.scrollTop = stream.scrollHeight;
        } catch (e) {
            alert('API 連線失敗，請檢查 Key 是否正確。');
        }
    }
</script>

</body>
</html>
